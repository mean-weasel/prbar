# GoalBuddy v2 state.yaml
version: 2

goal:
  title: "iOS Tab Hero Detail Simplification"
  slug: "ios-tab-hero-detail-simplification"
  kind: existing_plan
  tranche: "Screenshot-led hero/detail split and style simplification across PRBar iOS tabs."
  status: done
  oracle:
    signal: "A final Judge audit verifies that PRBar iOS tabs are hero-first, fine-grain detail has moved into intentional drilldowns or disclosures, required controls remain reachable and safe, tests pass, and simulator screenshots prove the rendered UX."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing targeted build/test commands plus XcodeBuildMCP screenshots for every changed tab/detail workflow."
  intake:
    original_request: "Do that after agreeing that fine-grain details should move to separate screens while each tab keeps the big picture as the hero."
    interpreted_outcome: "Prepare and execute a GoalBuddy board for simplifying PRBar iOS into hero-first tabs with detail screens for deeper work, validated in simulator."
    input_shape: existing_plan
    audience: "PRBar iOS users who need fast shipping-rhythm, growth, sharing, and setup understanding."
    authority: approved
    proof_type: demo
    completion_proof: "The simulator visibly shows hero-first tabs, detail/drilldown routes for fine-grain content, preserved controls, and passing verification."
    likely_misfire: "Applying cosmetic style tweaks while leaving dense details on the main tabs, or hiding privacy/setup controls that should remain reachable."
    blind_spots_considered:
      - "A passing UI smoke can miss cramped, visually incoherent hierarchy."
      - "Live GitHub/PostHog credentials may be absent locally, so deterministic simulator sample paths need to prove the UX while live-only checks are documented."
      - "The worktree already contains unrelated dirty files; the PM must preserve them and avoid broad reverts."
      - "PR #138's Work Log detail split should be treated as a successful pattern to preserve."
    existing_plan_facts:
      - "Each tab should lead with the big picture as the hero."
      - "Fine-grain details such as Latest meaningful work should be separate screens or deliberate drilldowns."
      - "The simulator is the validation surface."
      - "Simplification should improve styles without turning into unbounded restyling."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: generated
    url: "http://goalbuddy.localhost:41737/ios-tab-hero-detail-simplification/"
    command: "npx goalbuddy board Docs/goals/ios-tab-hero-detail-simplification"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map current iOS tab/detail hierarchy and identify where fine-grain content still competes with each tab's hero."
    inputs:
      - "PR #138 Activity Work Log detail split"
      - "Docs/goals/ios-shipping-rhythm-simplification/notes/T007-screenshot-brainstorm.md"
      - "Current SwiftUI views and UI tests"
      - "AGENTS.md simulator visual-inspection requirements"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Prefer concrete file-path and screenshot evidence over generic taste advice."
      - "Attempt automated simulator visual inspection before asking the user to verify manually."
    expected_output:
      - "Current tab-by-tab hierarchy map"
      - "Fine-grain content that should move to drilldowns/disclosures"
      - "Style/hierarchy repetition that harms the hero"
      - "Recommended largest safe first Worker slice"
    receipt:
      result: done
      summary: "Mapped the current iOS hierarchy from code, dirty diff, saved screenshots, and a fresh XcodeBuildMCP simulator launch. Activity still has the most detail pressure: the hero is clear, but the main tab also carries dual range pickers, calendars, selected-day metric, repo distribution, release cadence, selected release, sync provenance, and Work Log entry. Work Log, repo detail, Share, and Settings already show useful hero/detail movement. Recommend the first Worker slice focus on Activity's main tab and release/cadence detail split."
      evidence:
        - "apple/PRBar/RootTabView.swift: Activity, Growth, Share, and Settings are the authenticated tabs."
        - "apple/PRBar/PRs/PRsView.swift: Activity owns Shipping rhythm hero, Shipping snapshot, cadence, repo distribution, release cadence, selected release, sync status, and Work Log link."
        - "apple/PRBar/PRs/ActivityWorkLogView.swift: Work Log is already a dedicated detail screen for recent PR/release rows."
        - "apple/PRBar/PRs/PRRepositoryDetailView.swift: repo drilldown is already timeline-first with PR distribution and selected-day PR rows."
        - "apple/PRBar/Growth/GrowthView.swift: Growth leads with metrics/chart but still exposes range, provider badges, dashboard scope, provenance, provider sections, and setup cards in one scroll."
        - "apple/PRBar/Share/ShareView.swift and apple/PRBar/Share/ExportCardSheet.swift: Share leads with a public-safe export flow, while privacy/evidence copy remains prominent."
        - "apple/PRBar/More/MoreView.swift, SettingsView.swift, RepositorySetupView.swift, PrivacyDefaultsView.swift: Settings already behaves like a hub, with diagnostics and repo/privacy details pushed into child screens."
        - "Docs/goals/ios-shipping-rhythm-simplification/notes/T007-screenshot-brainstorm.md: prior screenshot read identified Activity/repo detail, Share/export, Settings/setup, and style-system slices."
        - "Fresh XcodeBuildMCP simulator launch on iPhone 17 with --ui-testing: Activity, Growth, Share, and Settings snapshots captured and inspected."
      facts:
        - "Current tab map: Activity is the shipping-rhythm dashboard; Growth is after-shipping metrics; Share is work-card export; Settings is account/setup hub."
        - "Activity's Work Log split proves the desired pattern: the main tab can carry a compact summary while detailed PR/release rows live in a drilldown."
        - "Activity's release cadence and selected release detail still live on the main tab and compete with the high-level Shipping rhythm readout."
        - "Activity has two independent range pickers/calendars for PRs and releases on one tab, which makes the main tab feel like multiple analytical screens stacked together."
        - "Repo detail no longer matches the older brainstorm's duplicate Recent PRs critique; the current file has PR distribution plus selected-day PRs only."
        - "Settings already matches the hero/detail intent better than the other tabs: status hero, Manage links, Diagnostics link, App links."
        - "Share is improved but privacy/evidence copy is safety-sensitive; it should follow Activity unless Judge decides safety copy can be simplified without weakening export protection."
        - "Current dirty files already include Share, Settings, repo detail, repo distribution, and UI-test edits, so the first Worker must preserve existing user/worktree changes."
      contradictions:
        - "The prior screenshot brainstorm says repo detail has a duplicate Recent PRs list, but the current worktree's PRRepositoryDetailView no longer contains that list."
        - "Saved contact-sheet screenshots show older dense Settings/Share states, while fresh code and simulator snapshots show later simplifications."
      ambiguity_requiring_judge:
        - "Should the first Worker create an Activity release/cadence detail destination inside PRsView, or only collapse release cadence behind a disclosure?"
        - "Should Activity keep one PR-focused range picker on the main tab while release range moves to detail, or should both ranges move behind drilldowns?"
        - "Can the Worker edit only PRsView/UI tests, or should it include shared components such as RepoDistributionView and CalendarStripView?"
      commands:
        - cmd: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.8/skills/goalbuddy/scripts/check-update.mjs --json"
          status: pass
        - cmd: "npx goalbuddy prompt Docs/goals/ios-tab-hero-detail-simplification"
          status: pass
        - cmd: "git status --short --branch"
          status: pass
        - cmd: "XcodeBuildMCP session_set_defaults + build_run_sim --ui-testing + snapshot_ui + screenshots"
          status: pass
      recommended_first_worker:
        objective: "Make Activity's main tab more hero-first by moving release cadence/selected-release detail and any secondary calendar controls into an intentional Activity detail drilldown or disclosure, while preserving the Shipping snapshot, primary cadence readout, repo distribution drilldown, Work Log, sync state, and tests."
        likely_allowed_files:
          - "apple/PRBar/PRs/PRsView.swift"
          - "apple/PRBar/PRs/ActivityWorkLogView.swift"
          - "apple/PRBar/Components/RepoDistributionView.swift"
          - "apple/PRBarUITests/PRBarUITests.swift"
          - "Docs/goals/ios-tab-hero-detail-simplification/state.yaml"
        verify:
          - "./scripts/ios-build.sh"
          - "Focused Activity UI tests or updated PRBarUITests for Work Log, release detail, and repo drilldown."
          - "XcodeBuildMCP screenshots: Activity top, Activity scrolled cadence/release entry, Work Log detail, release/cadence detail, repo detail."
      note_needed: false

